name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate extension and run regression tests
        run: bash .github/scripts/validate.sh
      - name: Install browser test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/goablockad-browser" playwright@1.65.0 --no-audit --no-fund
          "$RUNNER_TEMP/goablockad-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test unpacked extension in Chromium
        run: NODE_PATH="$RUNNER_TEMP/goablockad-browser/node_modules" node tests/browser.cjs
